# Fetches the latest data from LA County's public services, rebuilds the maps, and publishes them to GitHub Pages.
# Runs monthly and whenever someone clicks "Run workflow" on the Actions tab.
name: Build and publish map

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 1 * *'   # 10:00 UTC on the 1st of each month

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch County data (assessor roll, parcels, area boundaries)
        run: python fetch_county_data.py --out work
      - name: Build maps
        run: >
          python build_county.py --roll work/roll.csv --parcels work/parcels.gpkg
          --cpa work/la_cpa.geojson --uninc work/unincorporated.geojson --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      # GitHub Pages is sometimes slow to process this large site and the deploy step gives up after 10 minutes
      # (its maximum); try again up to twice with the same build before failing.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # wait before retrying: an immediate retry is rejected ("Deployment cancelled") while Pages is still
      # cancelling the timed-out attempt
      - if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 300
      - id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
