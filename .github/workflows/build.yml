# Fetches the latest data from LA County's public services, rebuilds the maps, and publishes them to GitHub Pages.
# Runs monthly and whenever someone clicks "Run workflow" on the Actions tab.
name: Build and publish map

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 1 * *'   # 10:00 UTC on the 1st of each month

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch County data (assessor roll, parcels, area boundaries)
        run: python fetch_county_data.py --out work
      - name: Build maps
        run: >
          python build_county.py --roll work/roll.csv --parcels work/parcels.gpkg
          --cpa work/la_cpa.geojson --uninc work/unincorporated.geojson --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # ms; the full site (~500 MB, ~1,200 files) takes Pages longer than the 10-minute default to process
